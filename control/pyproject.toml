[project]
name = "cascadeshield-control"
version = "0.1.0"
description = "CascadeShield control room (Fedora): resilience core, dashboard, load and experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "redis>=5.0",
    "prometheus-client>=0.20",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "locust>=2.31",
    "streamlit>=1.40",
    "plotly>=5.24",
    "pandas>=2.2",
    "pyarrow>=17",
    "networkx>=3.3",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
ml = ["scikit-learn>=1.5", "shap>=0.46", "xgboost>=2.1", "joblib>=1.4", "matplotlib>=3.9"]

[tool.uv]
package = false
default-groups = ["dev", "ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["ignore::gevent.monkey.MonkeyPatchWarning"]  # importing the locustfile in tests
