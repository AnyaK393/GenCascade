# Projector-friendly theme (guide 7.1): fixed light, high contrast, large base font.
# Streamlit reads this from the directory it is started in (control/, see control.mk).
[theme]
base = "light"
primaryColor = "#1c5cab"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
baseFontSize = 17
font = "sans-serif"

[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
