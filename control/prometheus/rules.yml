groups:
- name: cs
  interval: 2s
  rules:
  - record: cs:latency_p95:15s
    expr: histogram_quantile(0.95, sum by (service, le) (rate(cs_http_request_duration_seconds_bucket[15s])))
  - record: cs:error_rate:15s
    expr: sum by (service) (rate(cs_http_requests_total{status=~"5.."}[15s])) / sum by (service) (rate(cs_http_requests_total[15s]))
  - record: cs:rps:15s
    expr: sum by (service) (rate(cs_http_requests_total[15s]))
