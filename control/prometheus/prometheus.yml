# Targets come from targets/platform.json, generated by `make prom-targets` from
# PLATFORM_HOST. Prometheus re-reads it on change, so switching from the mock to the
# Mac needs no restart.
global:
  scrape_interval: 2s
  scrape_timeout: 2s
  evaluation_interval: 2s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: platform
    # Services set their own `service` label; the target label fills it in for
    # metrics that lack it (the default process collector).
    honor_labels: true
    file_sd_configs:
      - files: [/etc/prometheus/targets/*.json]
        refresh_interval: 5s

  - job_name: resilience_core
    static_configs:
      - targets: ["localhost:8600"]
        labels: {service: resilience_core}
