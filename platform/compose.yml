# Mac-owned compose file (profile "platform"), included from the root docker-compose.yml.
# CS_PLATFORM_DIR (exported by platform.mk) keeps paths absolute for podman-compose too.
x-svc: &svc
  profiles: ["platform"]
  image: cascadeshield-platform:dev
  pull_policy: never  # built once by llm_inference below
  mem_limit: 160m
  restart: unless-stopped
  extra_hosts: ["host.docker.internal:host-gateway"]
  volumes: ["${CS_PLATFORM_DIR:-.}/data:/app/data:ro"]  # vet cache_seed.yaml without a rebuild
  healthcheck:
    test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen(f'http://localhost:{os.environ[\"PORT\"]}/health', timeout=2)"]
    interval: 5s
    timeout: 3s
    retries: 10
    start_period: 20s
    start_interval: 1s  # poll every second while starting, so the depends_on chain is quick
  environment: &env
    CS_TOKEN: ${CS_TOKEN:-dev-token}
    PROTECTION_MODE: ${PROTECTION_MODE:-cascadeshield}
    CHAOS_ENABLED: ${CHAOS_ENABLED:-0}
    LLM_BACKEND: ${LLM_BACKEND:-ollama}
    LLM_MODEL: ${LLM_MODEL:-qwen2.5:0.5b}
    LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-20}
    MAX_INFLIGHT: ${MAX_INFLIGHT:-2}
    MAX_QUEUE: ${MAX_QUEUE:-40}
    MOCK_TOKENS_PER_S: ${MOCK_TOKENS_PER_S:-41}
    OLLAMA_URL: http://host.docker.internal:11434
    REDIS_HOST: redis
    REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-redis}
    STUDENT_URL: http://student:8001
    ORCHESTRATOR_URL: http://orchestrator:8002
    RAG_URL: http://rag:8003
    LLM_URL: http://llm_inference:8004
    DATA_DIR: /app/data
    DB_PATH: /data/student.db

services:
  redis:
    profiles: ["platform"]
    image: redis:7.4-alpine
    mem_limit: 96m
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-dev-redis} --maxmemory 64mb --maxmemory-policy volatile-lru
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 10s
      start_interval: 1s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-redis}

  llm_inference:
    <<: *svc
    build: ${CS_PLATFORM_DIR:-.}
    ports: ["8004:8004"]
    environment: {<<: *env, SERVICE_NAME: llm_inference, SERVICE_MODULE: llm_inference, PORT: "8004"}

  rag:
    <<: *svc
    mem_limit: 320m
    ports: ["8003:8003"]
    environment: {<<: *env, SERVICE_NAME: curriculum_rag, SERVICE_MODULE: rag, PORT: "8003"}
    depends_on: {redis: {condition: service_healthy}}

  student:
    <<: *svc
    ports: ["8001:8001"]
    volumes: ["student-data:/data", "${CS_PLATFORM_DIR:-.}/data:/app/data:ro"]
    environment: {<<: *env, SERVICE_NAME: student, SERVICE_MODULE: student, PORT: "8001"}

  orchestrator:
    <<: *svc
    ports: ["8002:8002"]
    environment: {<<: *env, SERVICE_NAME: orchestrator, SERVICE_MODULE: orchestrator, PORT: "8002"}
    depends_on:
      redis: {condition: service_healthy}
      student: {condition: service_healthy}
      rag: {condition: service_healthy}
      llm_inference: {condition: service_healthy}

  gateway:
    <<: *svc
    ports: ["8000:8000"]
    environment: {<<: *env, SERVICE_NAME: gateway, SERVICE_MODULE: gateway, PORT: "8000"}
    depends_on:
      redis: {condition: service_healthy}
      student: {condition: service_healthy}
      orchestrator: {condition: service_healthy}

volumes:
  student-data:
