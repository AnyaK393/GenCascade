  question: What is the difference between a stack and a queue?
  answer: A stack is a data structure that follows the Last In, First Out (LIFO) principle, meaning that
    the element that is pushed onto a stack is the last to be popped, and the elements that are popped
    are the first to be added. In contrast, a queue follows the First In, First Out (FIFO) principle,
    where the element that is added to a queue is the first to be removed, and the elements removed are
    the first to be added.
