    in a graph, and is given by `L = V / E`, where `V` is the number of vertices and `E` is the number
    of edges. The load factor is crucial because it indicates how many vertices are on average in the
    graph. If the load factor is close to 1, the graph is relatively well-sampled and has high connectivity.
