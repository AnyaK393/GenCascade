- topic: file_systems
  question: What is an inode?
  answer: An inode (or storage node) is a unique identifier for a file or directory on a disk. It is a
    32-bit number that uniquely identifies the file or directory. It holds metadata about the file or
    directory, including the file's location, permissions, and other information. In Linux, for example,
    the file system uses a 32-bit inode as the entry point for file access, allowing for fast directory
    lookups. In Windows, on the other hand, the file system uses a 16-bit inode, which is a file identifier,
    to indicate the location of each file or directory. The size of an inode can vary, and it's important
    to note that larger inodes (up to 64 GB or 128 GB) can cause performance issues in many file systems,
    so it's generally not advisable to use large inodes.
