  question: How does paging remove external fragmentation?
  answer: Paging works by replacing large blocks of data with smaller, more efficient blocks of memory.
    This process helps to minimize external fragmentation because it reduces the number of free blocks
    available for use by the OS. When a process allocates memory, it creates a contiguous block of data.
    The OS then uses this block to allocate memory for the process, which can be moved to a free block
    if needed. This ensures that the data is not wasted in the future, thereby reducing the risk of external
    fragmentation.
