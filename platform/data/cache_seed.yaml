  question: What is the difference between internal and external fragmentation?
  answer: 'Internal fragmentation occurs where the free space within a block is wasted, typically due
    to the space being used by an already running process. External fragmentation occurs when the block
    contains free space that can be used by another process, leading to wasted space and slower performance.


    In the context of paging, when a process allocates memory, the system first tries to fit the allocation
    into a contiguous block, which is called a base block. This block contains the physical address of
    the allocated memory. However, if the base block is already in use, the system must allocate more
    space, which increases the internal fragmentation.


    When the OS does not free the allocated memory blocks, it may cause fragmentation due to the increased
    internal fragmentation. Compacting the system reduces internal fragmentation but not external fragmentation.
    This is because compaction is expensive, whereas the OS''s default behavior is to try to free as much
    space as possible, reducing external fragmentation.'
