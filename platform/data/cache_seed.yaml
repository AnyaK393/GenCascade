  question: How can a system recover from a deadlock?
  answer: 'A system can recover from a deadlock by using a counter for cycles to track when a cycle starts
    and when it ends. When a cycle starts, it triggers a counter, and it stops when the cycle is detected.
    A system can detect a cycle by keeping a count of how many cycles are currently active and waiting
    for a cycle to start.


    To track cycles:

    1. Increment the cycle counter when a cycle starts.

    2. Decrement the cycle counter when a cycle ends.

    3. Check the cycle counter at the start of a new cycle.


    If a cycle starts, the system will immediately stop the cycle and move to the next cycle. If a cycle
    ends, the system will detect the cycle and wait until the cycle is detected. This way, a system can
    detect and recover from a deadlock by using a cycle counter to track when a cycle starts and when
    it ends.'
