  question: What is thrashing?
  answer: In an operating system, thrashing refers to the phenomenon where a process has to swap or move
    from memory to disk multiple times to access the same piece of data. It occurs when the amount of
    memory a process has allocated to it is insufficient, leading to frequent page faults (where the operating
    system needs to retrieve the data from disk) and reduced performance.
