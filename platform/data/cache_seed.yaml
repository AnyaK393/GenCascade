- topic: synchronization
  question: What is the critical section problem?
  answer: The critical section problem is a fundamental concept in concurrent programming that occurs
    when two or more threads race to access a shared resource, and the outcome is dependent on the sequence
    of access times. Specifically, if a thread tries to access the resource before another thread has
    acquired access, the result is undefined, leading to a race condition. The race condition arises because
    if one thread goes ahead and gets the resource before the other, it will consume the resource before
    the other thread can acquire it. This leads to a race where the outcome of both threads depends on
    timing and cannot be relied upon to be predictable.
