  question: What is a hash collision and how is it handled?
  answer: 'A hash collision occurs when the hash function maps a key to multiple bucket indices. This
    happens when the hash function cannot uniquely map a key to a single bucket index, leading to multiple
    buckets being assigned to the same key. To handle collisions:

    1. Use a chaining strategy: Store the key in each bucket where it belongs.

    2. Use open addressing: Use a probing strategy (like linear probing) to find the next available bucket.

    3. Use an open address index: Assign each key to a random bucket to avoid collisions.'
  vetted: false
