  question: What is the difference between chaining and open addressing?
  answer: In a hash table, chaining and open addressing both serve the purpose of storing and retrieving
    values, but they achieve this by different mechanisms. Open addressing involves probing for a free
    slot, while chaining uses a list per bucket to handle collisions. Open addressing typically has a
    higher hit rate but suffers from increased collisions. Chaining, however, has a lower hit rate but
    is less affected by collisions, making it more suitable for applications like web searches, where
    frequent updates and lookups are common.
