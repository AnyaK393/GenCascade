  question: What is a TLB and why does it speed up paging?
  answer: The Translation Lookaside Buffer (TLB) is a system memory that stores tables that quickly identify
    the page number associated with a given physical address. Without a TLB, each physical page needs
    to be accessed directly, leading to slower access times and increased memory usage. The TLB reduces
    this overhead, allowing a single access to the same physical page to be processed sequentially instead
    of sequentially and consecutively. This is why a TLB speeds up paging.
