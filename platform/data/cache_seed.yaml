  question: Why is the optimal page replacement algorithm not used in practice?
  answer: The optimal page replacement algorithm, which is based on the LRU (Least Recently Used) policy,
    is not widely used in practice because it requires more frequent page faults and can lead to a phenomenon
    known as "Belady's anomaly," where more frames (or more frequent page faults) can occur. However,
    the LRU algorithm is simple to implement and is often used in scenarios where a larger number of pages
    need to be accessed frequently or where the number of free frames is limited. In these cases, the
    LRU algorithm can be used in conjunction with the page fault counting method provided in the course
    notes to provide a more efficient and consistent way of managing page fault counts.
