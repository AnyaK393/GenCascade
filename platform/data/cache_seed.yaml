  question: What is the difference between a mutex and a semaphore?
  answer: A mutex is a synchronization primitive that allows multiple processes to access a shared resource
    while preventing other processes from accessing the resource. It protects access to a resource by
    marking it as "busy" to ensure that only one process can access it at a time. A semaphore, on the
    other hand, is a synchronization primitive that allows multiple processes to access a resource, but
    it does not prevent other processes from accessing it. Instead, it limits the maximum number of processes
    that can access the resource at once. Semaphore values range from 0 to 255.
