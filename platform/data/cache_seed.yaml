  question: What are the four conditions for deadlock?
  answer: 'The four conditions for deadlock are:


    1. **Mutual Exclusion**: A process must not be blocked by another process.

    2. **Hold and Wait**: A process must have an exit hook or a hold and wait condition.

    3. **No Preemption**: A process cannot preempt another process.

    4. **Circular Wait**: A process may wait on a non-atomic wait queue.


    **Example**: Consider a system with two processes, A and B, where A needs to read from a resource,
    and B needs to write to the same resource. If B enters a hold and wait condition, it will block A
    from accessing the resource. If B has an exit hook or holds the resource, it will not block A. If
    A waits indefinitely on the resource, B will not wait, and A will continue to wait indefinitely. This
    ensures that deadlock occurs.'
