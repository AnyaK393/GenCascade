  question: How do first fit, best fit and worst fit differ?
  answer: 'First fit, best fit, and worst fit are three different ways to allocate memory in OS processes.
    Each method has its own trade-off between the cost of storing a memory block and the cost of evicting
    it. Here’s a brief overview of how they work:


    1. **First Fit**: This method places a block in the first available memory block that can be allocated.
    If the block is already occupied, it does not need to be evicted. The cost is the size of the block,
    and the space is reclaimed when the block is no longer in use.


    2. **Best Fit**: This method places a block in the block that is closest to the request (i.e., the
    block that has the smallest distance from the request). If no such block exists, a new block is created.
    The cost is the size of the block, and the space is reclaimed when the block is no longer in use.


    3. **Worst Fit**: This method places a block in the block that is closest to the request (i.e., the
    block that is farthest from the request). If no such block exists, a new block is created. The cost
    is the size of the block, and the space is reclaimed when the block is no longer in use.


