DBMS201:
- topic: er_model
  question: What is the difference between an entity and an attribute?
  answer: An entity is a thing you store data about, such as Student or Course. An attribute is a property
    of it, such as name or roll number. In your problem, which nouns are things and which describe those
    things?
  vetted: true
- topic: er_model
  question: What is a weak entity?
  answer: A weak entity cannot be identified by its own attributes alone; it depends on an owner entity,
    like a Dependent of an Employee. What would make up its key, then?
  vetted: true
- topic: er_model
  question: How do I show a many-to-many relationship in an ER diagram?
  answer: Draw a relationship diamond between the two entities with M and N on the two sides. When you
    turn it into tables, you need a separate table for the relationship. Which keys would that table hold?
  vetted: true
- topic: er_model
  question: What is the difference between total and partial participation?
  answer: Total participation means every instance of the entity must take part in the relationship (a
    double line); partial means some may not. Must every Student enrol in a Course, or can a student have
    no enrolments?
  vetted: true
- topic: er_model
  question: How do I convert an ER diagram into tables?
  answer: 'Start with one table per strong entity, using its key as the primary key. Then turn each relationship
    into a foreign key (1:N) or its own table (M:N). Where does the foreign key go in a 1:N relationship:
    on the 1 side or the N side?'
  vetted: true
- topic: relational_model
  question: What is the difference between a primary key and a candidate key?
  answer: A candidate key is any minimal set of attributes that uniquely identifies a row; there can be
    several. The primary key is the one you choose. Can you find more than one candidate key in your table?
  vetted: true
- topic: relational_model
  question: What is a foreign key and why is it needed?
  answer: A foreign key is a column that refers to the primary key of another table. It stops rows that
    point to something that does not exist. What should happen if you try to insert an enrolment for a
    student who isn't in the Student table?
  vetted: true
- topic: relational_model
  question: What is a super key?
  answer: A super key is any set of attributes that uniquely identifies a row, even if it has extra attributes
    it doesn't need. How is that different from a candidate key?
  vetted: true
- topic: relational_model
  question: Can a primary key be null?
  answer: No. The primary key must be unique and NOT NULL, because it is what identifies each row. If
    two rows had NULL as their key, could you tell them apart?
  vetted: true
- topic: relational_model
  question: What is referential integrity?
  answer: Referential integrity means every foreign key value must match an existing row in the referenced
    table (or be NULL). What should the database do if you delete a row that other rows still refer to?
  vetted: true
- topic: sql_basics
  question: What is the difference between WHERE and HAVING?
  answer: WHERE filters individual rows before grouping; HAVING filters groups after GROUP BY. If you
    want only the courses whose average mark is above 70, which one can see the average?
  vetted: true
- topic: sql_basics
  question: How does GROUP BY work?
  answer: GROUP BY puts rows with equal values in the listed columns into one group, and aggregates (COUNT,
    SUM, AVG) compute one value per group. Which columns can then appear in the SELECT list?
  vetted: true
- topic: sql_basics
  question: What is the difference between DELETE, TRUNCATE and DROP?
  answer: DELETE removes the rows you choose (it can use WHERE and can be rolled back); TRUNCATE removes
    all rows quickly but keeps the table; DROP removes the table itself, structure included. Which would
    you use to clear a table but keep using it?
  vetted: true
- topic: sql_basics
  question: Why does comparing with NULL using equals not work?
  answer: NULL means 'unknown', so NULL = NULL is not true; it is unknown, and WHERE keeps only rows that
    are true. Which operator does SQL provide to test for NULL instead?
  vetted: true
- topic: sql_basics
  question: In which order does SQL evaluate the clauses of a SELECT?
  answer: Logically SQL evaluates FROM/JOIN, then WHERE, GROUP BY, HAVING, SELECT and finally ORDER BY.
    Given that order, can WHERE use a column alias defined in SELECT? Can ORDER BY?
  vetted: true
- topic: joins
  question: What is the difference between an inner join and a left join?
  answer: An inner join keeps only rows that match in both tables. A left join keeps every row of the
    left table and fills in NULLs where the right table has no match. Which would you use to list all
    students, including those with no enrolments?
  vetted: true
- topic: joins
  question: Why does my join return duplicate rows?
  answer: A join produces one output row for each matching pair. If a student matches three enrolment
    rows, how many rows does that student get? Check whether your join condition uses the full key.
  vetted: true
- topic: joins
  question: What is a self join and when is it used?
  answer: A self join joins a table to itself using two aliases. It is used when rows relate to other
    rows in the same table, such as an employee and their manager. How would you write employee e joined
    to manager m?
  vetted: true
- topic: joins
  question: What is a natural join?
  answer: A natural join automatically joins on every column with the same name in both tables. Why can
    that be risky if both tables happen to share a column like 'name' or 'id'?
  vetted: true
- topic: joins
  question: When does a full outer join produce NULLs?
  answer: A full outer join keeps unmatched rows from both sides. Where a left row has no match, the right
    columns are NULL, and the other way round. Which rows in your result have NULLs, and which table did
    they come from?
  vetted: true
- topic: normalization
  question: What is a functional dependency?
  answer: X → Y means that whenever two rows have the same X values, they also have the same Y value.
    In a Student table, does roll_no → name hold? Does name → roll_no?
  vetted: true
- topic: normalization
  question: What is the difference between 2NF and 3NF?
  answer: 2NF removes partial dependencies, where a non-key attribute depends on only part of a composite
    key. 3NF also removes transitive dependencies, where a non-key attribute depends on another non-key
    attribute. Which of the two does your table have?
  vetted: true
- topic: normalization
  question: What is BCNF and how is it stricter than 3NF?
  answer: BCNF requires that for every non-trivial dependency X → Y, X is a super key. 3NF allows an exception
    when Y is part of a candidate key. Can you find a dependency in your table whose left side isn't a
    super key?
  vetted: true
- topic: normalization
  question: Why do we normalize a database?
  answer: Normalization removes redundancy, so each fact is stored once. If a teacher's phone number is
    copied into every course row, what can go wrong when it changes?
  vetted: true
- topic: normalization
  question: What is a partial dependency?
  answer: A partial dependency is when a non-key attribute depends on only part of a composite primary
    key. With key (student_id, course_id), does course_name need both parts or just one?
  vetted: true
- topic: indexing
  question: How does an index make queries faster?
  answer: An index is a sorted structure (often a B+ tree) that points to rows, like the index at the
    back of a book. Without one, how many rows must the database check to find a single id?
  vetted: true
- topic: indexing
  question: Why are B+ trees used for database indexes?
  answer: 'B+ trees are short and wide: each node holds many keys and fits a disk page, so a lookup reads
    only a few pages. The leaves are also linked in order. Why does that linking help range queries?'
  vetted: true
- topic: indexing
  question: What is the difference between a clustered and a non-clustered index?
  answer: A clustered index decides the physical order of the rows, so a table can have only one. A non-clustered
    index is a separate structure with pointers to the rows. Why can there be several non-clustered indexes
    but only one clustered index?
  vetted: true
- topic: indexing
  question: Why can too many indexes slow down inserts?
  answer: Every INSERT, UPDATE or DELETE has to update every index on the table as well. With ten indexes,
    how much extra work does one insert cause?
  vetted: true
- topic: indexing
  question: When does the database not use an index?
  answer: The optimizer may skip an index when the query returns a large share of the table, when a function
    wraps the indexed column, or when the leading column of a composite index is missing. Which of these
    applies to your query?
  vetted: true
- topic: transactions
  question: What does ACID stand for?
  answer: Atomicity, Consistency, Isolation and Durability. For each one, can you think of what would
    go wrong in a bank transfer without it?
  vetted: true
- topic: transactions
  question: What is the difference between commit and rollback?
  answer: COMMIT makes a transaction's changes permanent; ROLLBACK undoes all of its changes since it
    began. If something fails halfway through, which one do you want?
  vetted: true
- topic: transactions
  question: What does atomicity mean for a bank transfer?
  answer: A transfer is a debit and a credit. Atomicity means either both happen or neither does. What
    would go wrong if the system crashed after the debit but before the credit?
  vetted: true
- topic: transactions
  question: What is durability and how is it guaranteed?
  answer: Durability means that once a transaction commits, its changes survive a crash. Databases do
    this by writing a log to disk before confirming the commit. Why write the log first rather than the
    data pages?
  vetted: true
- topic: transactions
  question: What happens to a transaction if the system crashes?
  answer: 'On restart, recovery uses the log: committed transactions are redone and uncommitted ones are
    undone. Which group does a transaction that hadn''t committed when the crash happened fall into?'
  vetted: true
- topic: concurrency_control
  question: What is a dirty read?
  answer: A dirty read is reading a value another transaction has written but not yet committed. What
    is the problem if that other transaction then rolls back?
  vetted: true
- topic: concurrency_control
  question: How does two-phase locking work?
  answer: In 2PL a transaction has a growing phase, where it only acquires locks, then a shrinking phase,
    where it only releases them. Once it releases its first lock it may take no new ones. Why does that
    rule guarantee a serializable schedule?
  vetted: true
- topic: concurrency_control
  question: What is the difference between shared and exclusive locks?
  answer: Several transactions can hold shared (read) locks on an item at once; an exclusive (write) lock
    can be held by only one, with no other locks at the same time. Can a read and a write lock coexist
    on the same item?
  vetted: true
- topic: concurrency_control
  question: What is a deadlock between transactions?
  answer: 'A deadlock is when transactions wait for each other in a cycle: T1 holds A and waits for B,
    while T2 holds B and waits for A. Neither can continue. How could the database detect or break such
    a cycle?'
  vetted: true
- topic: concurrency_control
  question: What is conflict serializability?
  answer: A schedule is conflict serializable if swapping non-conflicting operations can turn it into
    some serial schedule. Draw the precedence graph, with an edge for each pair of conflicting operations.
    What does a cycle in that graph tell you?
  vetted: true
- topic: query_processing
  question: What does the query optimizer do?
  answer: The optimizer turns your SQL into many equivalent plans (join orders, access paths, join algorithms),
    estimates the cost of each and picks the cheapest. What information does it need to estimate how many
    rows each step produces?
  vetted: true
- topic: query_processing
  question: Why is pushing selections down a query tree useful?
  answer: Filtering early shrinks the intermediate results before the expensive joins. If a join would
    combine 10,000 × 10,000 rows but a selection keeps only 100 of the first table, which order is cheaper?
  vetted: true
- topic: query_processing
  question: What is the difference between a nested loop join and a hash join?
  answer: 'A nested loop join compares each row of one table with every row of the other: simple, and
    good when one side is tiny or indexed. A hash join builds a hash table on one side and probes it with
    the other. Which suits a large equality join?'
  vetted: true
- topic: query_processing
  question: How does the optimizer estimate the cost of a query?
  answer: It uses statistics such as table sizes, distinct values and histograms to estimate how many
    rows each operator produces, then converts that into disk I/O and CPU cost. What happens to the plan
    if those statistics are out of date?
  vetted: true
- topic: query_processing
  question: What is a query execution plan?
  answer: 'It is the step-by-step plan the database will use to run your query: which indexes, which join
    method, in what order. Most databases show it with EXPLAIN. Which step of the plan would you look
    at first if the query is slow?'
  vetted: true
- topic: recovery
  question: What is a write-ahead log?
  answer: A write-ahead log records every change in the log on disk before the changed data pages are
    written. After a crash, the log is used to redo or undo work. Why must the log record reach disk first?
  vetted: true
- topic: recovery
  question: What is the difference between undo and redo?
  answer: Undo uses the old values in the log to reverse changes made by uncommitted transactions; redo
    uses the new values to reapply changes made by committed ones. After a crash, which transactions need
    each?
  vetted: true
- topic: recovery
  question: What is a checkpoint and why is it used?
  answer: A checkpoint writes dirty pages to disk and records a point in the log. Recovery then only needs
    to start from the last checkpoint instead of the beginning of the log. How does that affect recovery
    time?
  vetted: true
- topic: recovery
  question: What does the ARIES algorithm do?
  answer: 'ARIES is a recovery algorithm that uses a write-ahead log in three passes after a crash: analysis,
    redo and undo. Redo replays history, including uncommitted work. Why does it then need the undo pass?'
  vetted: true
- topic: recovery
  question: What is the difference between deferred and immediate update?
  answer: With deferred update, changes are written to the database only after commit, so recovery never
    needs undo. With immediate update, changes can reach the database before commit. Which one then needs
    both undo and redo?
  vetted: true
- topic: er_model
  question: Can you explain entity-relationship model simply?
  answer: The ER model describes data as entities (things like Student or Course), attributes (their properties)
    and relationships between them. If a student enrolls in a course, which part of the model is 'enrolls'?
  vetted: true
- topic: er_model
  question: What are common mistakes with entity-relationship model?
  answer: 'Common slips: making something an entity when it should be an attribute, getting cardinality
    the wrong way round, and forgetting weak entities that depend on another entity. Can a student take
    many courses, and can a course have many students?'
  vetted: true
- topic: er_model
  question: What is the key idea behind entity-relationship model?
  answer: An ER diagram is a plan of what the data means before you build tables. How does a relationship's
    cardinality decide whether you need a separate table for it?
  vetted: true
- topic: er_model
  question: Give me a hint about entity-relationship model.
  answer: Read the problem statement and underline the nouns and verbs. Which nouns become entities, which
    become attributes, and which verbs become relationships?
  vetted: true
- topic: er_model
  question: What should I revise about entity-relationship model before the exam?
  answer: Revise entities and attributes (including multivalued and derived ones), keys, weak entities,
    cardinality and participation, and mapping an ER diagram to tables. Can you turn a many-to-many relationship
    into tables?
  vetted: true
- topic: relational_model
  question: Can you explain relational model and keys simply?
  answer: The relational model stores data in tables of rows and columns, where each row is identified
    by a key. If two students share a name, what lets you tell their rows apart?
  vetted: true
- topic: relational_model
  question: What are common mistakes with relational model and keys?
  answer: 'Common slips: confusing candidate, primary and super keys, allowing NULL in a primary key,
    and foreign keys that point to rows that do not exist. What should happen when you delete a row another
    table still refers to?'
  vetted: true
- topic: relational_model
  question: What is the key idea behind relational model and keys?
  answer: Keys give every row an identity, and foreign keys link tables without copying data. Why is it
    better to store a course id in the enrollment table than the full course details?
  vetted: true
- topic: relational_model
  question: Give me a hint about relational model and keys.
  answer: List the columns of your table and ask which smallest set of them is always unique. Is that
    set a candidate key, and is any column in it unnecessary?
  vetted: true
- topic: relational_model
  question: What should I revise about relational model and keys before the exam?
  answer: Revise relations, tuples and attributes, super, candidate, primary and foreign keys, integrity
    constraints, and relational algebra (select, project, join). Can you find all candidate keys of a
    small table?
  vetted: true
- topic: sql_basics
  question: Can you explain sql basics simply?
  answer: SQL lets you ask a database questions. SELECT picks columns, FROM names the table, WHERE filters
    rows and ORDER BY sorts them. Which clause would you use to keep only the students from one course?
  vetted: true
- topic: sql_basics
  question: What are common mistakes with sql basics?
  answer: 'Common slips: using WHERE on aggregated values instead of HAVING, selecting columns that are
    not in the GROUP BY, and comparing with = NULL instead of IS NULL. When you filter on COUNT(*), which
    clause does it belong in?'
  vetted: true
- topic: sql_basics
  question: What is the key idea behind sql basics?
  answer: 'SQL is declarative: you describe what result you want, not how to get it. In what order does
    the database logically apply FROM, WHERE, GROUP BY, HAVING and SELECT?'
  vetted: true
- topic: sql_basics
  question: Give me a hint about sql basics.
  answer: Build the query one clause at a time and run it after each step. Does the row count after WHERE
    match what you expect before you add GROUP BY?
  vetted: true
- topic: sql_basics
  question: What should I revise about sql basics before the exam?
  answer: Revise SELECT, WHERE, GROUP BY, HAVING, ORDER BY, aggregate functions, NULL handling, subqueries
    and INSERT, UPDATE and DELETE. Can you explain the difference between WHERE and HAVING with an example?
  vetted: true
- topic: joins
  question: Can you explain joins simply?
  answer: A join combines rows from two tables that match on a column, such as enrollments and students
    matching on student id. If a student has no enrollments, should they appear in the result?
  vetted: true
- topic: joins
  question: What are common mistakes with joins?
  answer: 'Common slips: forgetting the join condition, which multiplies every row with every other row,
    mixing up left and right joins, and filtering an outer join in WHERE so it becomes an inner join.
    How many rows would you get without the ON condition?'
  vetted: true
- topic: joins
  question: What is the key idea behind joins?
  answer: Inner joins keep only matches, while outer joins also keep unmatched rows from one side, filled
    with NULLs. Which join answers 'list every student, even those with no course'?
  vetted: true
- topic: joins
  question: Give me a hint about joins.
  answer: Sketch two tiny tables with three rows each and write the result of the join by hand. Which
    rows have no partner, and which join type keeps them?
  vetted: true
- topic: joins
  question: What should I revise about joins before the exam?
  answer: Revise inner, left, right and full outer joins, self-joins, natural join and the cross product,
    and how joins relate to relational algebra. Can you write a query to find students who are not enrolled
    in anything?
  vetted: true
- topic: normalization
  question: Can you explain normalization simply?
  answer: Normalization splits tables so that each fact is stored in one place, which avoids update, insert
    and delete anomalies. If a teacher's phone number is stored in every course row, what goes wrong when
    it changes?
  vetted: true
- topic: normalization
  question: What are common mistakes with normalization?
  answer: 'Common slips: confusing partial and transitive dependencies, decomposing in a way that loses
    information, and getting the candidate keys wrong before starting. Have you found every candidate
    key first?'
  vetted: true
- topic: normalization
  question: What is the key idea behind normalization?
  answer: Each normal form removes one kind of bad functional dependency. For 2NF, what kind of dependency
    on part of the key are you trying to remove?
  vetted: true
- topic: normalization
  question: Give me a hint about normalization.
  answer: Write down the functional dependencies first, then check each one against the definition of
    the normal form. Is the left side of every dependency a superkey?
  vetted: true
- topic: normalization
  question: What should I revise about normalization before the exam?
  answer: Revise functional dependencies, closures, 1NF, 2NF, 3NF and BCNF, lossless and dependency-preserving
    decomposition. Can you take a small table to 3NF and check that the decomposition is lossless?
  vetted: true
- topic: indexing
  question: Can you explain indexing and b+ trees simply?
  answer: 'An index is like the index at the back of a book: it lets the database find rows without reading
    the whole table. A B+ tree index keeps keys sorted in a short, wide tree. Why does a wide tree mean
    fewer disk reads?'
  vetted: true
- topic: indexing
  question: What are common mistakes with indexing and b+ trees?
  answer: 'Common slips: indexing every column, which slows down writes, expecting an index to help with
    low-selectivity columns, and forgetting that leaf nodes in a B+ tree are linked. Which queries does
    an index actually speed up?'
  vetted: true
- topic: indexing
  question: What is the key idea behind indexing and b+ trees?
  answer: A B+ tree keeps all data pointers in the leaves and links them, so range queries are fast once
    you find the start. How does that help with WHERE age BETWEEN 18 AND 21?
  vetted: true
- topic: indexing
  question: Give me a hint about indexing and b+ trees.
  answer: Think about how many keys fit in one disk block and how tall the tree becomes for a million
    rows. How many disk reads does one lookup need?
  vetted: true
- topic: indexing
  question: What should I revise about indexing and b+ trees before the exam?
  answer: Revise primary vs secondary and clustered vs unclustered indexes, B+ tree search, insertion
    and node splits, and hash indexes vs B+ trees. Can you insert a few keys into a small B+ tree and
    show a split?
  vetted: true
- topic: transactions
  question: Can you explain transactions and acid simply?
  answer: A transaction is a group of operations that should happen all together or not at all, like moving
    money between two accounts. What should the database do if it crashes halfway through?
  vetted: true
- topic: transactions
  question: What are common mistakes with transactions and acid?
  answer: 'Common slips: mixing up the four ACID properties, assuming consistency is guaranteed by the
    database alone, and forgetting that isolation levels allow some anomalies. Which ACID property makes
    a committed change survive a crash?'
  vetted: true
- topic: transactions
  question: What is the key idea behind transactions and acid?
  answer: 'ACID is the promise: atomicity, consistency, isolation and durability. Which of them is about
    transactions not seeing each other''s half-finished work?'
  vetted: true
- topic: transactions
  question: Give me a hint about transactions and acid.
  answer: Take the bank transfer example and ask, for each ACID property, what would go wrong without
    it. Which failure would leave money missing?
  vetted: true
- topic: transactions
  question: What should I revise about transactions and acid before the exam?
  answer: Revise the ACID properties, transaction states, commit and rollback, schedules, serializability
    and isolation levels. Can you give an example of a dirty read?
  vetted: true
- topic: concurrency_control
  question: Can you explain concurrency control simply?
  answer: Concurrency control lets many transactions run at once without corrupting the data, using locks
    or timestamps. If two people book the last seat at the same time, what has to stop both from succeeding?
  vetted: true
- topic: concurrency_control
  question: What are common mistakes with concurrency control?
  answer: 'Common slips: thinking two-phase locking prevents deadlock (it does not), mixing up shared
    and exclusive locks, and confusing conflict and view serializability. Can two transactions both hold
    a shared lock on the same item?'
  vetted: true
- topic: concurrency_control
  question: What is the key idea behind concurrency control?
  answer: The goal is a result equal to running the transactions one after another. How does a precedence
    graph tell you whether a schedule is conflict serializable?
  vetted: true
- topic: concurrency_control
  question: Give me a hint about concurrency control.
  answer: 'Draw the precedence graph for your schedule: one node per transaction, an edge for each conflicting
    pair of operations. Is there a cycle?'
  vetted: true
- topic: concurrency_control
  question: What should I revise about concurrency control before the exam?
  answer: Revise lost update, dirty read and unrepeatable read, shared and exclusive locks, two-phase
    locking and strict 2PL, timestamp ordering and deadlock handling. Can you check whether a given schedule
    is conflict serializable?
  vetted: true
- topic: query_processing
  question: Can you explain query processing and optimization simply?
  answer: When you send a query, the database parses it, considers several ways to run it, estimates the
    cost of each and picks the cheapest. Why might two plans for the same query differ a lot in speed?
  vetted: true
- topic: query_processing
  question: What are common mistakes with query processing and optimization?
  answer: 'Common slips: ignoring the cost of reading from disk, applying selections late instead of early,
    and assuming join order does not matter. Would you rather filter a table before or after joining it?'
  vetted: true
- topic: query_processing
  question: What is the key idea behind query processing and optimization?
  answer: Optimization rewrites the query into an equivalent but cheaper plan, using rules like pushing
    selections down. Why does shrinking the inputs early make the joins cheaper?
  vetted: true
- topic: query_processing
  question: Give me a hint about query processing and optimization.
  answer: Draw the query as a tree of operations and ask which operations cut the most rows. Can you move
    them closer to the tables?
  vetted: true
- topic: query_processing
  question: What should I revise about query processing and optimization before the exam?
  answer: Revise query trees, equivalence rules, selection pushdown, join algorithms (nested loop, sort-merge,
    hash) and cost estimation. Can you compare the cost of a nested loop join and a hash join for two
    tables?
  vetted: true
- topic: recovery
  question: Can you explain recovery simply?
  answer: Recovery brings the database back to a correct state after a crash, using a log of every change.
    If a transaction committed just before the crash, how can its changes still be there afterwards?
  vetted: true
- topic: recovery
  question: What are common mistakes with recovery?
  answer: 'Common slips: mixing up undo and redo, forgetting that the log must be written before the data
    (write-ahead logging), and misreading what a checkpoint saves. Which transactions need redo and which
    need undo after a crash?'
  vetted: true
- topic: recovery
  question: What is the key idea behind recovery?
  answer: The log records enough to redo committed work and undo uncommitted work. Why must the log record
    reach disk before the changed data page does?
  vetted: true
- topic: recovery
  question: Give me a hint about recovery.
  answer: Take a small log with a checkpoint and a crash, and list each transaction as committed or not
    at the crash. Which ones does recovery redo, and which ones does it undo?
  vetted: true
- topic: recovery
  question: What should I revise about recovery before the exam?
  answer: Revise log records, write-ahead logging, deferred vs immediate update, checkpoints, and the
    redo and undo phases (and ARIES if covered). Can you run recovery by hand on a short log?
  vetted: true
OS202:
- topic: processes
  question: What is the difference between a program and a process?
  answer: A program is a passive file of instructions on disk. A process is a program in execution, with
    its own memory, registers, program counter and state. If you run the same program twice, how many
    processes do you get?
  vetted: true
- topic: processes
  question: What are the states of a process?
  answer: The usual states are new, ready (waiting for the CPU), running, waiting or blocked (for I/O
    or an event) and terminated. What moves a process from running to waiting, and from waiting back to
    ready?
  vetted: true
- topic: processes
  question: What is a process control block?
  answer: 'The PCB is the kernel''s record for a process: its ID, state, saved registers and program counter,
    memory information, open files and scheduling details. During a context switch, what must be saved
    in it?'
  vetted: true
- topic: processes
