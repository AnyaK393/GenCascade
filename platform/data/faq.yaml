# Likely student questions, 5 per topic (guide 5.7). tools/seed_cache.py answers each at level 0
# and writes data/cache_seed.yaml; Phase 3 pre-warm uses the same questions.
# _common: asked for every topic too, with {name} = the topic title from hints.yaml in lower case.
_common:
- Can you explain {name} simply?
- What are common mistakes with {name}?
- What is the key idea behind {name}?
- Give me a hint about {name}.
- What should I revise about {name} before the exam?
DSA101:
  arrays:
  - Why is accessing an array element by index O(1)?
  - Why is inserting at the beginning of an array slow?
  - What is the difference between an array and a dynamic array?
  - How do I reverse an array in place?
  - Why does my loop give an index out of range error on the last element?
  linked_lists:
  - When should I use a linked list instead of an array?
  - How do I reverse a singly linked list?
  - How do I detect a cycle in a linked list?
  - Why do I lose the rest of the list when I insert a node?
  - What is the difference between a singly and a doubly linked list?
  stacks_queues:
  - What is the difference between a stack and a queue?
  - How can I check balanced parentheses with a stack?
  - How do I implement a queue using two stacks?
  - What is a circular queue and why is it useful?
  - What happens on stack overflow and underflow?
  hashing:
  - How does a hash table get O(1) average lookup?
  - What is a hash collision and how is it handled?
  - What is the difference between chaining and open addressing?
  - What is the load factor and why does it matter?
  - When does a hash table lookup become O(n)?
  recursion:
  - What is a base case and why do I need one?
  - Why does my recursive function cause a stack overflow?
  - How do I trace a recursive call on paper?
  - What is the difference between recursion and iteration?
  - How does memoization make recursion faster?
  sorting:
  - Why is merge sort O(n log n)?
  - What is the worst case of quicksort and when does it happen?
  - What does it mean for a sorting algorithm to be stable?
  - When is insertion sort faster than merge sort?
  - How does choosing a pivot affect quicksort?
  binary_search:
  - Why does binary search need a sorted array?
  - Why is binary search O(log n)?
  - How do I avoid an infinite loop in binary search?
  - How do I find the first occurrence of a value with binary search?
  - Why should I write mid as low plus half the range?
  bst:
  - What property must every node in a binary search tree satisfy?
  - How do I delete a node with two children from a BST?
  - Why does inserting sorted keys make a BST slow?
  - What does inorder traversal of a BST give?
  - How is a balanced BST different from a normal BST?
  heaps:
  - What is the difference between a heap and a binary search tree?
  - How does heapify work after removing the root?
  - Why is building a heap O(n) and not O(n log n)?
  - How is a heap stored in an array?
  - How is a priority queue related to a heap?
  graphs:
  - What is the difference between BFS and DFS?
  - When should I use BFS instead of DFS?
  - Why do I need a visited set in graph traversal?
  - What is the difference between an adjacency list and an adjacency matrix?
  - How does BFS find the shortest path in an unweighted graph?
