spring.application.name=staff-portal
spring.profiles.default=dev
server.port=8085

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.property-naming-strategy=SNAKE_CASE

management.endpoints.web.exposure.include=health

# Never sent to the browser: used only for the server-to-server call to the resilience core.
cs.core-url=${CORE_URL:http://localhost:8600}
cs.token=${CS_TOKEN:dev-token}

links.status=${STATUS_PAGE_URL:http://localhost:8080/status/}
links.notes=${NOTES_URL:http://localhost:8070/}
links.dashboard=${DASHBOARD_URL:http://localhost:8501/}
